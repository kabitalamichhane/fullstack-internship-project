# FS-03 LMS - full local stack (ports differ from FS-01 so both can run at once)
# Start:      docker compose up --build
# Demo data:  docker compose exec api npx tsx prisma/seed.ts
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms
    ports: ['5433:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6380:6379']

  # S3-compatible storage. In production: AWS S3 bucket + CloudFront distribution in front of it.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9010:9000', '9011:9001']
    volumes: [miniodata:/data]

  create-bucket:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/lms-media;
      mc anonymous set download local/lms-media/hls;
      mc anonymous set download local/lms-media/thumbnails;
      exit 0;"

  # LiveKit WebRTC server in dev mode (API key "devkey", secret "secret")
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports: ['7880:7880', '7881:7881', '7882:7882/udp']

  api:
    build: ./backend
    env_file: ./backend/.env.example
    environment: &backend-env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lms?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      CDN_BASE_URL: http://localhost:9010/lms-media
      LIVEKIT_URL: ws://localhost:7880
      CLIENT_URL: http://localhost:5174
    ports: ['5000:5000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }

  worker:
    build: ./backend
    command: ['node', 'dist/worker.js']
    env_file: ./backend/.env.example
    environment: *backend-env
    depends_on: [api]

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    ports: ['5174:80']
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
