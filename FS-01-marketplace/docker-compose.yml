# FS-01 Marketplace - full local stack
# Start everything:   docker compose up --build
# Then seed data:     docker compose exec api npx tsx prisma/seed.ts && docker compose exec api node dist/scripts/reindex.js
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketplace
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ['9200:9200']
    volumes: [esdata:/usr/share/elasticsearch/data]

  # MinIO = S3-compatible storage for local development (use real AWS S3 in production)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]

  create-bucket:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/marketplace-images;
      mc anonymous set download local/marketplace-images;
      exit 0;"

  api:
    build: ./backend
    env_file: ./backend/.env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/marketplace?schema=public
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000/marketplace-images
      CLIENT_URL: http://localhost:5173
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      elasticsearch: { condition: service_started }
      minio: { condition: service_started }

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    ports: ['5173:80']
    depends_on: [api]

volumes:
  pgdata:
  esdata:
  miniodata:
