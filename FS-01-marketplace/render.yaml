# Render blueprint for the FS-01 backend (frontend is deployed separately on Vercel/Netlify)
services:
  - type: web
    name: marketplace-api
    runtime: docker
    rootDir: FS-01-marketplace/backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: marketplace-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: marketplace-redis, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PLATFORM_COMMISSION_PERCENT
        value: '10'

  - type: redis
    name: marketplace-redis
    plan: free
    ipAllowList: []

databases:
  - name: marketplace-db
    plan: free
